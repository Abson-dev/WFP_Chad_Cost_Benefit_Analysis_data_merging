bookdown::gitbook:
  css: style.css
  includes:
    in_header: favicon.html #Pour mettre le favicon
    after_body: footer.html     # Footer pour le HTML
  config:
    toc:
      before: |
        <li><a href="./">Cost Benefit Analysis of WFP Resilience Interventions in Chad, 2018-2023</a></li>
      after: |
        <li><a href="https://github.com/rstudio/bookdown" target="blank">Published with bookdown</a></li>
    edit: https://github.com/USERNAME/REPO/edit/BRANCH/%s
    download: ["pdf", "epub"]
bookdown::pdf_book:
  includes:
    in_header: preamble.tex
  latex_engine: xelatex
  citation_package: natbib
  keep_tex: yes
bookdown::epub_book: default
